name: Deploy Duel Legends

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild site package
        run: |
          cat payload/part00.b64 payload/part01.b64 payload/part02.b64 | base64 -d > site.zip
          mkdir site
          unzip -q site.zip -d site

      - name: Fix leading-zero card IDs
        working-directory: site
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/fetch_images.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'url = f"https://images.ygoprodeck.com/images/cards/{cid}.jpg"',
              'url = f"https://images.ygoprodeck.com/images/cards/{int(cid)}.jpg"'
          )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Fetch card scans
        working-directory: site
        run: python scripts/fetch_images.py

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
